[workspace]
authors = ["Kyle Shannon <kyle@kmshannon.com>"]
channels = ["conda-forge"]
name = "subiculum-lit-analysis"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
init-db = { cmd = "sqlite3 data/raw/subiculum_literature.db < data/raw/schema.sql", description = "Initialize SQLite database with schema" }
test-api = { cmd = "bash scripts/test_api.sh", description = "Test PubMed API connectivity" }
test-utils = { cmd = "python tests/test_utils_validation.py", description = "Test shared utilities (logger, database, credentials)" }
integration-tests = { cmd = "python tests/test_api_integration.py && python tests/test_xml_parsing.py && python tests/test_db_integration.py", description = "Run integration tests" }
system-test = { cmd = "python tests/system/test_full_pipeline.py", description = "Run full pipeline system test (requires CROSSREF_EMAIL and SEMANTIC_SCHOLAR_EMAIL env vars)" }
run-pipeline = { cmd = "python src/pipeline.py", description = "Run ETL pipeline" }
enrich-citations = { cmd = "python scripts/enrich_citations.py", description = "Enrich citation data from CrossRef and Semantic Scholar" }

[dependencies]
python = "3.11.*"
numpy = ">=2.3.4,<3"
pandas = ">=2.3.3,<3"
scipy = ">=1.11.0,<2"
matplotlib = ">=3.10.7,<4"
jupyterlab = ">=4.4.10,<5"
ipykernel = ">=7.1.0,<8"
requests = ">=2.31.0,<3"
lxml = ">=5.0.0,<6"
pyyaml = ">=6.0,<7"
pytest = ">=8.4.2,<9"
tqdm = ">=4.66.0,<5"
scikit-learn = ">=1.3.0"
seaborn = ">=0.13.0"
plotly = ">=5.18.0"
networkx = ">=3.2"
nltk = ">=3.8"
wordcloud = ">=1.9.0"
sqlalchemy = ">=2.0.0"
python-dotenv = ">=1.0.0"
